<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive pathfinding and sorting algorithm visualizer" />
  <title>Algo Visualizer</title>

  <script type="module" src="/src/main.js"></script>

</html>
